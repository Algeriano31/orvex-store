 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - VOLT 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- الهيدر -->
        <div class="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-2xl font-extrabold text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> لوحة تحكم VOLT 2.0
                </h1>
                <p class="text-slate-400 text-xs sm:text-sm">إدارة المنتجات، التوصيل، وروابط الموردين الأصليين</p>
            </div>
            <a href="/" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm px-4 py-2 rounded-xl shadow-lg transition flex items-center gap-2">
                <span>الرجوع للمتجر</span>
                <i class="fa-solid fa-store"></i>
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- نموذج إضافة منتج -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-square-plus text-green-400"></i> إضافة منتج جديد
                </h2>
                <form id="add-product-form" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">اسم المنتج</label>
                        <input type="text" id="p-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="مثال: ساعة ذكية">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">السعر ($)</label>
                            <input type="number" step="0.01" id="p-price" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="29.99">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">التصنيف</label>
                            <select id="p-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                                <option value="إلكترونيات">إلكترونيات</option>
                                <option value="هواتف">هواتف</option>
                                <option value="ملابس">ملابس</option>
                                <option value="عام">عام</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">رابط صورة المنتج</label>
                        <input type="url" id="p-image" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="https://example.com/image.jpg">
                    </div>
                    
                    <!-- حقل رابط المنتج لدى المورد الاصلي -->
                    <div>
                        <label class="block text-xs font-bold text-amber-400 mb-1">🔗 رابط المنتج عند المورد (AliExpress/Alibaba)</label>
                        <input type="url" id="p-supplier-url" class="w-full bg-slate-900 border border-amber-500/40 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="https://aliexpress.com/item/...">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">رقم واتساب المورد</label>
                        <input type="text" id="p-phone" value="213777083158" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">وصف المنتج</label>
                        <textarea id="p-desc" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="وصف قصير..."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>حفظ ونشر المنتج 🚀</span>
                    </button>
                </form>
            </div>

            <!-- قائمة المنتجات والتحكم بها -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                    <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-blue-400"></i> المنتجات ورابط المصدر
                    </h2>
                    <div id="admin-products-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                        <div class="text-slate-500 text-center py-4">جاري التحميل...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const pRes = await fetch('/api/products?t=' + Date.now());
                const products = await pRes.json();
                const pContainer = document.getElementById('admin-products-list');
                
                if (!products || !products.length) {
                    pContainer.innerHTML = '<div class="text-slate-500 text-center py-4">لا توجد منتجات.</div>';
                } else {
                    pContainer.innerHTML = products.map(p => `
                        <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700/50">
                            <div class="flex items-center gap-3">
                                <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg bg-slate-950">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-200">${p.name}</h4>
                                    <div class="flex items-center gap-2 mt-0.5">
                                        <span class="text-xs text-green-400 font-bold">${p.price} $</span>
                                        ${p.supplierUrl ? `
                                            <a href="${p.supplierUrl}" target="_blank" class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md hover:bg-amber-500 hover:text-slate-950 transition font-bold flex items-center gap-1">
                                                <i class="fa-solid fa-arrow-up-right-from-square"></i> رابط المورد
                                            </a>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/30 text-xs px-3 py-1.5 rounded-lg transition">
                                <i class="fa-solid fa-trash-can"></i> حذف
                            </button>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("خطأ جلب البيانات:", err);
            }
        }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newP = {
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value),
                category: document.getElementById('p-category').value,
                image: document.getElementById('p-image').value,
                supplierUrl: document.getElementById('p-supplier-url').value,
                supplierPhone: document.getElementById('p-phone').value,
                description: document.getElementById('p-desc').value
            };

            await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newP)
            });

            document.getElementById('add-product-form').reset();
            loadAdminData();
        });

        async function deleteProduct(id) {
            if (confirm("هل أنت تأكد من إزالة هذا المنتج؟")) {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                loadAdminData();
            }
        }

        loadAdminData();
    </script>
</body>
</html>
