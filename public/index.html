<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLT 2.0 - المتجر الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div class="bg-amber-500 text-slate-900 text-xs sm:text-sm py-2 px-4 text-center font-bold shadow-md flex items-center justify-center gap-2">
        <span>⚠️</span>
        <span>تنبيه: متجر VOLT 2.0 يعمل حالياً في وضع التشغيل الميداني!</span>
    </div>

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white font-extrabold text-xl px-3 py-1 rounded-lg shadow-lg">VOLT 2.0</div>
                <span class="text-xs bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full hidden sm:inline-block">منصة الموردين الذكية</span>
            </div>
        </div>
    </header>

    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-8 px-4 shadow-inner">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-2xl sm:text-4xl font-extrabold mb-2">متجر VOLT 2.0 - كتالوج المنتجات الحية</h1>
            <p class="text-blue-100 text-sm sm:text-base max-w-2xl mx-auto">اختر منتجك المفضل، وسيتولى النظام توجيه طلبك فوراً للمورد عبر واتساب!</p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">جاري تحميل المنتجات...</div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 text-slate-500 text-center py-6 text-sm">
        <p>جميع الحقوق محفوظة © 2026 - منصة VOLT 2.0</p>
    </footer>

    <script>
        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                displayProducts(products);
            } catch (err) {
                console.error("خطأ:", err);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('products-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد منتجات حالياً.</div>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col hover:border-blue-500/50 transition">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover bg-slate-950">
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="text-xs text-blue-400 font-bold mb-1">${p.category || 'عام'}</div>
                        <h3 class="font-bold text-lg text-slate-100 mb-2">${p.name}</h3>
                        <p class="text-slate-400 text-xs mb-4 flex-grow line-clamp-2">${p.description || ''}</p>
                        <div class="flex justify-between items-center pt-3 border-t border-slate-700/50 mt-auto">
                            <div>
                                <span class="text-xs text-slate-500 block">السعر</span>
                                <span class="text-xl font-extrabold text-green-400">${p.price} $</span>
                            </div>
                            <button onclick="orderProduct(${p.id}, '${p.name}', ${p.price}, '${p.supplierPhone}')" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2 rounded-xl shadow-lg transition">
                                طلب الآن ⚡
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function orderProduct(id, name, price, supplierPhone) {
            const phone = supplierPhone || '213777083158';
            const msg = `*طلب شراء جديد*%0A%0A*المنتج:* ${name}%0A*السعر:* ${price}$`;
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }

        fetchProducts();
    </script>
</body>
</html>
